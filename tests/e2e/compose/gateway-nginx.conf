events {}

# Package TLS reaches the firewall unchanged; its handshake owns client-key proof.
stream {
    resolver E2E_RESOLVER valid=2s ipv6=off;
    map $ssl_preread_server_name $package_target {
        fw1.e2e.test firewall-1:8080;
        fw2.e2e.test firewall-2:8080;
        fw-standalone.e2e.test firewall-standalone:8080;
        default 127.0.0.1:8443;
    }
    server {
        listen 443;
        proxy_pass $package_target;
        ssl_preread on;
    }
}

http {
    resolver E2E_RESOLVER valid=2s ipv6=off;
    ssl_certificate /e2e/tls/cert.pem;
    ssl_certificate_key /e2e/tls/key.pem;
    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1200s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    server {
        listen 8443 ssl;
        listen 8444 ssl;
        server_name portal.e2e.test sync.e2e.test;
        location / {
            set $upstream E2E_SERVER:8080;
            proxy_pass http://$upstream;
        }
    }
}
