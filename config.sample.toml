# Probation sample configuration (SPEC §4).
#
# Config changes need a restart. Blocklist changes do not.
#
# Managed mode (the `[management]` section at the end): settings pushed from the
# fleet page are written to `<data_dir>/managed-settings.toml`, never to this file,
# and merged over it at start. A push can never set `listen`, `public_url`,
# `data_dir`, `tls_cert_path`, `tls_key_path`, `siem_url`, `siem_auth_header` or
# `[management]`, and a pushed path must lie under `data_dir`.

listen = "127.0.0.1:8080"
public_url = "https://packages.example.org"
data_dir = "/var/lib/probation"
# The snapshot your blocklist producer writes and replaces atomically. This is
# not the `blocklist.sample.json` in this repository: that sample has a far-off
# `expires_at` so it always validates. Without a valid snapshot the service
# starts, answers /health/live but not /health/ready, and refuses every
# package request. A managed firewall ignores this file: it may leave out
# `blocklist_file` and `blocklist_poll_seconds`.
blocklist_file = "/etc/probation/blocklist.json"

# How long a release is withheld after publication. 0 turns off the age rule
# only; blocks still apply. At most 315360000 (ten years). In managed mode each
# key's policy sets the cooldown instead.
cooldown_seconds = 86400
metadata_ttl_seconds = 300
# How old a cached project snapshot may get since its last FULL fetch, however
# often upstream answers `304` (SPEC §10). Each project expires a little early,
# by up to a tenth, so projects fetched together do not all expire at once. An
# over-age snapshot is never served: if the full fetch fails, the request is
# refused. Must not be below `metadata_ttl_seconds`. 0 removes the limit and
# brings back the unbounded staleness it exists to close.
metadata_max_age_seconds = 86400
blocklist_poll_seconds = 5

cache_max_bytes = 107374182400        # 100 GiB, including temporary downloads
memory_cache_max_bytes = 268435456    # 256 MiB cache budget, not total process RSS
max_artifact_bytes = 5368709120       # 5 GiB
max_metadata_bytes = 67108864         # 64 MiB after decompression
max_blocklist_bytes = 134217728       # 128 MiB
max_upstream_requests = 32
max_artifact_downloads = 8
# A cold artifact request that finds every download permit taken waits for one,
# first come first served, for at most this many seconds (at most 60; 0 refuses
# at once). At most `max_download_waiters` requests wait at a time. Past either
# bound the request gets `503 OVERLOADED` with `Retry-After: 5`. npm opens 15
# connections by default, more than the 8 permits.
download_wait_seconds = 5
max_download_waiters = 64
max_active_requests = 1024
max_references_per_project = 20000

# Decision log delivery (§8 of docs/operations.md). Both sinks are off by
# default: with no `log_file_path` no file is opened, and with no `siem_url` no
# HTTP client is built. The stdout decision line is always written.
#
# Every decision is appended to this file as one JSON object per line. Exactly
# one process may write it. Never hand it to `logrotate`: this process rolls
# the file itself.
# log_file_path = "/var/log/probation/decisions.ndjson"
# The live file rolls over to `<log_file_path>.1` at this size, replacing any
# previous `.1`. One generation is kept, so the pair costs at most twice this.
# Refused without `log_file_path`.
# log_file_max_bytes = 104857600        # 100 MiB live, 200 MiB with the rollover
# How much memory this sink's queue may hold while the file falls behind. A
# memory budget like `memory_cache_max_bytes`, and on top of it. Once the queue
# is full, records are dropped and counted. Absent means 1875 MiB, enough for a
# 5-minute outage at 200 requests/second. Refused without `log_file_path`.
# log_queue_max_bytes = 1966080000      # 1875 MiB

# The collector decisions are also POSTed to, as newline-delimited JSON in
# batches of 256 records or 2 seconds, whichever comes first. Must use `https`
# unless the host is a loopback address or `localhost`.
# siem_url = "https://siem.example.org/services/collector/raw"
# The header the credential is sent under. The credential itself never goes in
# this file: it is read from the environment variable `PROBATION_SIEM_AUTH` at
# startup. With that variable unset, delivery is unauthenticated. Refused
# without `siem_url`.
# siem_auth_header = "Authorization"
# The same kind of budget for this sink's queue. It decides how long a collector
# outage costs nothing: records queue here while the collector is away and are
# dropped and counted once it is full. Absent means 1875 MiB. Two sinks are two
# queues, so a deployment with both pays both. Refused without `siem_url`.
# siem_queue_max_bytes = 1966080000     # 1875 MiB

# Whether every delivered record also carries the peer IP of the connection
# that asked, as a `consumer` field. Off by default, and then no record carries
# the field. Privacy note: this records who is installing packages. It is the
# peer address of the accepted TCP connection, never a port and never anything
# the caller supplies. Behind NAT or a load balancer it identifies that
# hop, not the machine that ran the install (§8 of docs/operations.md).
# Turning it off later erases nothing already written to the log file, its
# `.1`, the collector, or the host's console log.
# A log file this process creates gets mode 0600. A pre-existing file keeps its
# mode, and a group- or world-readable one is warned about once. With this on,
# a `log_file_path` that cannot be opened stops startup.
# Refused without `log_file_path` or `siem_url`, so the addresses it records
# reach a durable destination you chose.
# log_consumer_identification = false

# OSV vulnerability intelligence: every candidate your own blocklist would
# allow is also checked against OSV before it is served. A candidate is never
# blocked while an OSV lookup is unresolved: a slow or unreachable OSV costs
# staleness, never availability.
#
# How long an OSV answer is trusted before it is asked again. Optional, 300
# (5 minutes) if left out.
osv_cache_ttl_seconds = 300
# How long one OSV batch's outbound call may take before it fails open.
# Optional, 2000 if left out. With [management] or [service_policy] at least 1600 (the
# policy server answers OSV at 1500 ms).
osv_request_timeout_ms = 2000
# Managed and shared-service mode only (those modes ask the policy server, never
# api.osv.dev; the timeout above must then be at least 1600): how long a matched
# answer keeps refusing past its TTL while the server cannot be asked. Optional,
# 86400 (24 hours) if left out; 3600 to 604800.
# osv_stale_match_seconds = 86400
# What an OSV match does: `enforce` denies, `diagnostic` logs the match and
# allows, `off` skips the check. Optional, `enforce` if left out. In managed
# mode each key's policy sets this instead.
osv_mode = "enforce"

# TLS: `serve` terminates it itself when both keys are set (§6 of
# docs/operations.md says what still belongs in front of this service). Both
# or neither: one without the other is refused. Absent by default, and then
# `serve` binds plain HTTP.
# tls_cert_path = "/etc/probation/tls/cert.pem"
# tls_key_path = "/etc/probation/tls/key.pem"

# Upstream registries. Each key replaces one fixed origin: npm metadata
# (default https://registry.npmjs.org), PyPI metadata (default https://pypi.org)
# and PyPI downloads (default https://files.pythonhosted.org). Each must be an
# `https` origin with no username, password, query, fragment or path, and never
# a private, loopback or link-local address. All three are optional.
# npm_upstream_url = "https://npm-mirror.example.org"
# pypi_upstream_url = "https://pypi-mirror.example.org"
# pypi_artifacts_url = "https://pypi-files.example.org"
# RubyGems (indexes, quick gemspecs and gems; default https://rubygems.org), same rules.
# rubygems_upstream_url = "https://rubygems-mirror.example.org"
# Cargo: the sparse index (default https://index.crates.io) and the host its config.json names
# for crate files (`dl`, default https://static.crates.io). Set both for a mirror; a `dl` on any
# other origin is refused.
# cargo_upstream_url = "https://cargo-mirror.example.org"
# cargo_artifacts_url = "https://cargo-files.example.org"
# Go modules: the module host (default the public Go module host), the
# checksum database host the /go/sumdb/ route forwards to (default https://sum.golang.org) and the origin a
# zip redirect of the module host may land on (default the public module host's own storage bucket).
# One protected module host, no fallback.
# go_upstream_url = "https://gomirror.example.org"
# go_sumdb_url = "https://sumdb.example.org"
# go_artifacts_url = "https://gofiles.example.org"
# NuGet: the host of the v3 service index, flat container and registration (default https://api.nuget.org),
# the search host (default https://azuresearch-usnc.nuget.org) and the package publish host used through the
# shared service (default https://www.nuget.org). A resource a service index names on any other origin is
# not used (a mirror sets all three).
# nuget_upstream_url = "https://nuget-mirror.example.org"
# nuget_search_url = "https://nuget-search.example.org"
# nuget_publish_url = "https://nuget-push.example.org"
# Maven: the public repository, an origin AND the path prefix of its tree (default https://repo.maven.apache.org/maven2;
# a mirror's own prefix goes here), and the deploy URL `mvn deploy` is forwarded to for the public registry through the
# shared service (no default: Maven Central has none, so without it a deploy to the public registry is a 404).
# maven_upstream_url = "https://nexus.example.org/repository/maven-central"
# maven_publish_url = "https://nexus.example.org/repository/maven-releases"
# Conan 2: the public remote, an origin AND the path prefix of its `v2` tree (default https://center2.conan.io; an Artifactory
# remote has a prefix of its own: https://artifactory.example.org/artifactory/api/conan/conan-center), and the upload URL
# `conan upload` is forwarded to for the public registry through the shared service (no default: ConanCenter takes no uploads,
# so without it an upload to the public registry is a 404).
# conan_upstream_url = "https://artifactory.example.org/artifactory/api/conan/conan-center"
# conan_publish_url = "https://artifactory.example.org/artifactory/api/conan/conan-local"
# OCI registries (docker, podman, containerd, skopeo): the default registry the plain `/v2/` root serves (default https://registry-1.docker.io; an
# origin AND the optional path prefix of a registry's `v2` tree) and the one storage host a blob download on it may be redirected to (default
# https://production.cloudfront.docker.com; the caller's credential is never sent there). A shared service's selected registries name their own.
# oci_upstream_url = "https://registry.example.org/artifactory/api/docker/images"
# oci_artifacts_url = "https://objects.example.org"
# The token service of the default registry when its challenge names another host than the registry's own (a GitLab registry does: an https origin;
# a registry of a shared service or a certificate-managed firewall declares its own on the registry page). Without it a realm on another host is not asked.
# oci_token_url = "https://gitlab.example.org"
# The hosts a layer's own download `urls` may name (a foreign layer, which Windows base images use): an exact host, or `*.` and a domain for every
# host below it. https on the default port only, no user name, never an address. A manifest that names any other host is refused, and a layer's
# URL on the list is fetched by this firewall with no credential and verified against its digest. An empty list allows no foreign layer.
# Default: ["mcr.microsoft.com", "*.data.mcr.microsoft.com", "go.microsoft.com", "download.microsoft.com"].
# oci_foreign_layer_hosts = ["mcr.microsoft.com", "*.data.mcr.microsoft.com", "go.microsoft.com", "download.microsoft.com"]

# Shared-service mode ([service_policy], see docs/configuration.md) only: the load
# balancers in front of this firewall. From these peers `X-Forwarded-For` names the
# client whose upload places are counted (docs/operations.md, "who a spool share
# belongs to"). Without it every caller behind one counts as the balancer's address
# and shares four places; the firewall logs a warning when an unlisted peer sends the
# header. Optional, empty if left out.
# [service_policy]
# server_url = "https://policy.example.com"
# service_key_file = "/etc/probation/service.key"
# trusted_proxies = ["10.0.0.0/8"]

# Managed mode (docs/management-server.md): the firewall serves each request under
# its own API key's policy, which it fetches from a management server. Without this
# section it runs standalone, on `blocklist_file`. Every key in `[management]` is
# local: the management server can never push it.
#
# How often a managed firewall asks the server what changed. A top-level key, so
# it stays above `[management]`, and a push can change it. Optional, 60 if left
# out, at most 86400.
# sync_interval_seconds = 60
#
# [management]
# The server's sync API. https only, loopback included.
# url = "https://manage.example.org"
# The firewall token the fleet page or `probation-server admin bootstrap` printed,
# in a file of its own (never in this file).
# token_file = "/etc/probation/firewall.token"
# How long a cached key and its policy are served without a sync confirming them.
# At most 86400.
# key_cache_ttl_seconds = 300
# key_cache_max_entries = 100000
# Lookups a second for keys this firewall has no entry for, and one client
# address's share of them.
# lookup_budget_per_second = 50
# client_lookup_allowance_per_second = 5
# Each sync starts this much before the interval ends; at most half of it. The
# default is 5, or half the interval if that is less.
# sync_margin_seconds = 5
# A call to the server gives up after this; at most `sync_margin_seconds`. The
# default is 2, or the margin if that is less.
# request_timeout_seconds = 2
# Reverse proxies in front of this firewall whose `X-Forwarded-For` is believed for
# the network lock and the per-client lookup allowance. Empty: the peer address is
# the client (docs/operations.md §13).
# trusted_proxies = []

