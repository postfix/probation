# The certificate UPDATE must execute before returning success.
# Commit and next-request refusal require runtime controls.
name: certificate-revoke-before-success
kind: ordered_obligation
severity: critical
evidence: full
guard: {calls: {name: [execute]}}
operation: {calls: {name: [redirect]}}
relation: {must_dominate: true, allow_caller_paths: false}
where: "caller_function == 'revoke_certificate'"
