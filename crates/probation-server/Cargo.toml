[package]
name = "probation-server"
version = "0.2.2"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
description = "The probation management server: keys, layer policies and the firewall sync API."
repository = "https://github.com/postfix/probation"
# Ships as its own container image, never to crates.io (C102, C117).
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3.4"
ipnet = { version = "2.12.2", features = ["serde"] }
probation-policy = { path = "../probation-policy", version = "0.2.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Runtime-checked queries only: no `query!`, so building needs no database. `macros`
# is for `migrate!`, which embeds `migrations/` at compile time.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "ipnet", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The real firewall, for the tests that run one against this server (03 § Files).
probation = { path = "../..", features = ["test-support"] }
async-trait = "0.1.92"
bytes = "1.12.1"
reqwest = { version = "0.13.5" }
tempfile = "3.27.0"
url = "2.5.8"
