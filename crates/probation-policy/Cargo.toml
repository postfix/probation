[package]
name = "probation-policy"
# Released with `probation` and always at its version (C117).
version = "0.2.2"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
description = "The policy rules shared by the probation firewall and its management server."
repository = "https://github.com/postfix/probation"
keywords = ["npm", "pypi", "supply-chain", "policy"]
categories = ["web-programming"]

[dependencies]
nodejs-semver = "5.0.0"
pep440_rs = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"
