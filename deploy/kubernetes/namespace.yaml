# The namespace enforces the restricted Pod Security Standard: the pod of statefulset.yaml is written to pass it
# (non-root, no privilege escalation, all capabilities dropped, RuntimeDefault seccomp, read-only root file system).
apiVersion: v1
kind: Namespace
metadata:
  name: probation
  labels:
    app.kubernetes.io/part-of: probation
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
