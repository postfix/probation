# Guards invariant C12c (docs/plans/osv-intel/03-program-design.md, threat
# G1): the outbound `POST /v1/querybatch` call in `batcher::flush`
# (src/osv/batcher.rs) must stay wrapped in `tokio::time::timeout` so a
# hung OSV connection fails the whole batch open instead of blocking. Same
# `relation: {}` fix and reasoning as the sibling spec
# `enqueue-timeout-guard.yaml` -- read that file's header first for why
# `must_dominate: true` was tried and rejected.
#
# READ THE PASS CONDITION BEFORE READING THE FINDINGS. This spec does NOT
# pass at zero findings when scoped to its product file. It passes when
# `src/osv/batcher.rs:175` -- `tokio::time::timeout(request_timeout,
# send(&client, &url, &body)).await` -- is ABSENT from the findings, with
# exactly the ten known non-target findings below and no others. A
# finding AT line 175 is the breach this spec exists to catch (the
# `timeout` wrap was removed or the call moved out of `flush`). A finding
# at any OTHER line, or a different count of the ten, means the file
# changed and needs re-validating, not that the spec is broken.
#
# WHY ZERO ISN'T THE PASS CONDITION. `send` is the name of two different
# things in this one file: the free function `send(&client, &url, &body)`
# that `flush` calls under `timeout` (the invariant's actual target, line
# 175), and that free function's OWN body, which performs the real network
# call as `client.post(..).send()` (reported at line 223, where the
# `client` method chain starts; `.send()` itself is on 227) -- a second,
# unrelated call site also named `send`. `ordered_obligation`'s
# `relation: {}` only checks same-function co-occurrence, not call-graph
# transitivity, so the inner primitive at line 223 is
# correctly-by-the-letter flagged: no `timeout` call exists in ITS OWN
# function body, even though it is already covered by its caller's wrap
# one level up. The schema offers no predicate to exclude it: `calls:`
# accepts only `name`, `receiver_type`, `package` (confirmed via the
# daemon's own schema-validation error), and `receiver_type` cannot
# select this free-function call either -- confirmed experimentally that
# ANY `receiver_type` predicate, including `["^$"]`, structurally drops
# every call site that has no receiver at all, rather than matching or
# excluding by regex. The same file's `#[cfg(test)]` module (from line
# 255) adds nine more `tx.send` call sites -- test code feeding the
# batcher's request channel, not outbound requests -- with no `timeout`
# in their own test functions (lines 317, 357, 399, 425, 467, 468, 493,
# 494, 531), for the same underlying reason. Conversely, `flush`'s own
# `waiter.send(matched)` reply (line 209) is NOT a finding: it shares
# `flush` with the line-175 `timeout`, which is all `relation: {}` asks.
# So the trace reads 12 operations, 1 guard, 10 findings. This repo has
# an established precedent for a non-zero, count-and-line-checked pass
# condition when a clean zero isn't reachable with the current schema:
# see `.smtc/analyzers/consumer-identity-extension-read.yaml`.
#
# Validated against (last re-validated 2026-10-21, batcher.rs as of
# 01b94d7 "Answer the open batch when a batcher's channel closes"):
#   - docs/plans/osv-intel/controls/unsafe/unwrapped_outbound_send.rs:
#     fires, 1 finding at line 16 (the outer `send(client).await` has no
#     `timeout` in its own function).
#   - docs/plans/osv-intel/controls/safe/wrapped_outbound_send.rs: zero
#     findings, confirmed non-vacuous (`find_guards` matched 1, not 0).
#   - src/osv/batcher.rs (the product root): exactly ten findings, at
#     lines 223, 317, 357, 399, 425, 467, 468, 493, 494, 531 -- all
#     documented above -- and line 175 absent, confirming the target site
#     is recognized as guarded.
name: outbound-timeout-guard
kind: ordered_obligation
severity: high
guard: {calls: {name: ["timeout"]}}
operation: {calls: {name: ["send"]}}
relation: {}
