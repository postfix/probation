# Test-only: the stack tests/e2e/signup_to_install.sh drives (E2E-signup-to-install,
# M-propagation; C82). Postgres, the management server with its portal, a TLS proxy in
# front of the server's sync API (the server speaks plain HTTP, S4-1), and two managed
# firewalls that fetch from the real npm registry. The script writes every file the
# services mount into $E2E_WORK (configurations, the e2e CA and certificate, firewall
# tokens) and passes the ports below; run it rather than this file.
services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: probation
      POSTGRES_PASSWORD: probation
      POSTGRES_DB: probation
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "probation"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: crates/probation-server/Dockerfile
    image: localhost/probation-server:e2e
    environment:
      PROBATION_SERVER_DATABASE_URL: postgres://probation_e2e:probation@postgres/probation
      PROBATION_SERVER_MIGRATE_DATABASE_URL: postgres://probation:probation@postgres/probation
      PROBATION_SERVER_SECRET_KEY: ${E2E_SECRET_KEY}
    volumes:
      - ${E2E_WORK}/server.toml:/etc/probation-server/config.toml:ro
    ports:
      - "127.0.0.1:${E2E_PORTAL_PORT}:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    # The image has no curl: the binary asks its own /health/ready (Postgres answers).
    healthcheck:
      test: ["CMD", "probation-server", "health"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  # TLS for the sync API, as a deployment's reverse proxy gives it: a firewall only
  # talks to an https server (C34).
  sync:
    image: docker.io/library/nginx:1.27-alpine
    volumes:
      - ${E2E_WORK}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${E2E_WORK}/tls:/e2e/tls:ro
    depends_on:
      - server

  firewall-1: &firewall
    build:
      context: .
    image: localhost/probation:e2e
    # The system roots for the npm registry, plus the e2e CA for `sync`.
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /e2e/ca
    volumes:
      - ${E2E_WORK}/firewall-1.toml:/etc/probation/config.toml:ro
      - ${E2E_WORK}/firewall-1.token:/e2e/firewall.token:ro
      - ${E2E_WORK}/tls:/e2e/tls:ro
      - ${E2E_WORK}/ca:/e2e/ca:ro
    ports:
      - "127.0.0.1:${E2E_FIREWALL_1_PORT}:8443"
    depends_on:
      - sync
    # Exit 75 after a settings push asks the supervisor for a restart (C105).
    restart: unless-stopped

  firewall-2:
    <<: *firewall
    volumes:
      - ${E2E_WORK}/firewall-2.toml:/etc/probation/config.toml:ro
      - ${E2E_WORK}/firewall-2.token:/e2e/firewall.token:ro
      - ${E2E_WORK}/tls:/e2e/tls:ro
      - ${E2E_WORK}/ca:/e2e/ca:ro
    ports:
      - "127.0.0.1:${E2E_FIREWALL_2_PORT}:8443"
