name: Native service

# Row 25: the machine-wide native lifecycle and the native package tools on Linux, macOS and Windows, and the pinned Docker Engine
# daemon pull against the OCI routes. Every job runs the real probation binary under the runner's own service manager (systemd,
# launchd, the Windows service control manager) or the real pinned client against it; a missing runner, daemon, tool or version FAILS
# the job, and a test that reports SKIPPED fails it too (the lane did not run). Called from release.yml; also runnable by hand.
#   service-linux    systemd, system scope, default locations: install, start, stop, restart, crash, exit 75, second owner,
#                    permissions, upgrade, uninstall, with the pinned native npm and pip through the shared service
#   service-macos    launchd LaunchDaemon, the same lifecycle (macOS 26 records its launchd manual and sw_vers); built by service-macos-build,
#                    attested by attest-macos (which compiles nothing), installed from that package
#   service-windows  the Windows SCM service as NT SERVICE\Probation, the same lifecycle; service-windows-build and attest-windows likewise
#   tools            native Cargo, Go, NuGet and RubyGems clients against the firewall on each OS
#   tools-linux      the Maven and Conan pinned client images and the podman OCI engine (Linux only: those clients run in images)
#   docker-engine    Docker Engine 29.9.2 pinned, daemon pull through tests/oci_native.rs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# bash runs with -eo pipefail: `cargo test | tee` fails when cargo test does (the default `bash -e` would report tee's status).
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  PIN_NODE: "24.22.1"
  PIN_NPM: "11.21.1"
  PIN_PYTHON: "3.15.1"
  PIN_GO: "1.26.0"
  PIN_DOTNET: "8.0.416"
  PIN_RUBY: "3.4.11"
  PIN_RUBYGEMS: "3.6.9"
  PIN_DOCKER_ENGINE: "29.9.2"

jobs:
  service-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NATIVE_PLATFORM: linux-x64
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PIN_PYTHON }}
      - name: Install pinned clients
        run: |
          npm install --global "npm@$PIN_NPM"
          python -m pip install --only-binary=:all: --require-hashes -r tests/e2e/native/ci-requirements.txt
      - name: Verify exact client versions
        run: node tests/e2e/native/clients.mjs
      - run: npm ci --prefix tests/e2e --no-audit --no-fund
      - name: Build the native service
        run: cargo build --locked --bin probation
      - name: The host's service manager
        run: |
          systemctl --version | head -n 1
          cat /etc/os-release
      # As root, so the system service, /etc/probation and /var/lib/probation are the real ones an operator gets.
      - name: Native lifecycle and native package tools (system scope, systemd)
        env:
          E2E_SERVICE_SCOPE: system
          E2E_SERVICE_DIRS: system
          PROBATION_BIN: ${{ github.workspace }}/target/debug/probation
        run: >
          sudo -E env "PATH=$PATH" "VIRTUAL_ENV=${VIRTUAL_ENV:-}"
          node tests/e2e/harness/run.mjs --only E2E-service-native --client-host native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-service-linux
          path: target/e2e/out
          if-no-files-found: ignore

  # Each OS lane is three jobs, so that no job which compiles holds a token that can mint an OIDC identity (the OIDC request variables
  # reach every step of a job that holds id-token, and a build script or proc-macro runs in it): the `-build` job compiles and packages
  # with contents: read, the attest job holds id-token and attestations and runs no command of its own (two `uses` steps, no `run`), and
  # the lifecycle job installs the package and runs with contents: read. The installer verifies the attestation of the binary by its digest.
  service-macos-build:
    name: service-macos-build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AWS_LC_SYS_USE_SYSTEM: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - name: Provide OpenSSL's libcrypto for the OCSP code (for the linker only, the binary links it statically)
        run: node tests/e2e/native/openssl-setup.mjs apply
      # The RELEASE binary, in the released package layout: the gate tests what is shipped.
      - name: Build the native service (release)
        run: cargo build --release --locked --bin probation --features static-openssl
      - name: Package it as the release does
        run: scripts/package-release.sh ${{ matrix.target }} target/release/probation "$RUNNER_TEMP/pkg"
      # A CI package is not a release: no RELEASE-PACKAGE marker (the installer takes it as a dev package, the lifecycle driver passes --dev-package).
      # Its binary is attested by attest-macos below, by this workflow, with the action release.yml uses; the installer then verifies that
      # attestation with `--signer-workflow .github/workflows/native-service.yml --source-digest <this commit>` (the repository pin stays),
      # with every check of the installer left on. The step output names the binary by its exact path: an upload by glob keeps the package
      # directory in the artifact (ci-binary-*/probation-<version>-<target>/probation), where attest-macos looks for ci-binary-*/probation
      # (hosted run 46132783086: "Could not find subject"); an upload of one named file stores it at the artifact root.
      - name: Mark the package as a CI build and name what to upload
        id: pkg
        run: |
          pkg=$(echo "$RUNNER_TEMP"/pkg/probation-*)
          rm "$pkg/RELEASE-PACKAGE"
          grep -v ' RELEASE-PACKAGE$' "$pkg/SHA256SUMS" > "$pkg/SHA256SUMS.new"
          mv "$pkg/SHA256SUMS.new" "$pkg/SHA256SUMS"
          echo "binary=$pkg/probation" >> "$GITHUB_OUTPUT"
      # The package must not depend on Homebrew's OpenSSL: no dylib path of it in the binary, and the formula hidden while it runs.
      - name: The packaged binary needs no OpenSSL dylib
        run: |
          pkg=$(echo "$RUNNER_TEMP"/pkg/probation-*)
          otool -L "$pkg/probation" | tee "$RUNNER_TEMP/otool.txt"
          if grep -E "/opt/homebrew|/usr/local/(opt|Cellar)|libcrypto" "$RUNNER_TEMP/otool.txt"; then echo "the binary links libcrypto dynamically"; exit 1; fi
          prefix=$(brew --prefix openssl@3)
          sudo mv "$prefix" "$prefix.hidden"
          "$pkg/probation" --version
          sudo mv "$prefix.hidden" "$prefix"
      # upload-artifact drops the executable bit: the package travels as a tarball, and the bare binary is a second artifact for the attest job.
      - name: Pack the package
        run: tar czf "$RUNNER_TEMP/ci-package-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/pkg" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-package-${{ matrix.target }}
          path: ${{ runner.temp }}/ci-package-${{ matrix.target }}.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-binary-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.binary }}
          retention-days: 1
          if-no-files-found: error

  # Compiles nothing and runs no command: it holds the OIDC and attestation permissions, so it has two `uses` steps and no `run`.
  attest-macos:
    needs: service-macos-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-binary-*-apple-darwin
          merge-multiple: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ci-binary-*-apple-darwin/probation

  service-macos:
    name: service-macos ${{ matrix.target }}
    needs: attest-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-package-${{ matrix.target }}
          path: ${{ runner.temp }}
      - name: Unpack the package
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf "$RUNNER_TEMP/ci-package-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/pkg"
      # The launchd keys this lane relies on are those of the installed manual: record them with the OS version.
      - name: Record the OS and the installed launchd manual
        run: |
          mkdir -p "$RUNNER_TEMP/record"
          sw_vers | tee "$RUNNER_TEMP/record/sw_vers.txt"
          man launchd.plist | col -b > "$RUNNER_TEMP/record/launchd.plist.5.txt"
          man launchctl | col -b > "$RUNNER_TEMP/record/launchctl.1.txt"
          grep -n "SuccessfulExit\|ExitTimeOut\|ThrottleInterval\|Umask" "$RUNNER_TEMP/record/launchd.plist.5.txt"
      - name: Native lifecycle from the package (LaunchDaemon)
        env:
          E2E_SERVICE_SCOPE: system
          E2E_SERVICE_DIRS: system
          NATIVE_TEST_SCRATCH: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          E2E_SERVICE_SIGNER_WORKFLOW: .github/workflows/native-service.yml
          E2E_SERVICE_SOURCE_DIGEST: ${{ github.sha }}
        run: |
          pkg=$(echo "$RUNNER_TEMP"/pkg/probation-*)
          sudo -E env "PATH=$PATH" "E2E_SERVICE_PACKAGE=$pkg" node tests/e2e/native/service-lifecycle-run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-service-macos-${{ matrix.target }}
          path: ${{ runner.temp }}/record
          if-no-files-found: ignore

  service-windows-build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AWS_LC_SYS_USE_SYSTEM: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - name: Provide a static OpenSSL libcrypto for the OCSP code
        env:
          OPENSSL_STATIC: "1"
        run: node tests/e2e/native/openssl-setup.mjs apply
      - name: Build the native service (release)
        run: cargo build --release --locked --bin probation --features static-openssl
      - name: Package it as the release does (the exe with OpenSSL linked in, SHA256SUMS, the installer)
        run: scripts/package-release.sh x86_64-pc-windows-msvc target/release/probation.exe "$RUNNER_TEMP/pkg"
      # A CI package is not a release: no RELEASE-PACKAGE marker (the installer takes it as a dev package, the lifecycle driver passes --dev-package).
      # Its binary is attested by attest-windows below, by this workflow, with the action release.yml uses; the installer then verifies that
      # attestation with `--signer-workflow .github/workflows/native-service.yml --source-digest <this commit>` (the repository pin stays),
      # with every check of the installer left on. The step outputs name the package directory and the exe with forward slashes, for the uploads.
      - name: Mark the package as a CI build and name what to upload
        id: pkg
        run: |
          pkg=$(echo "$RUNNER_TEMP"/pkg/probation-*)
          rm "$pkg/RELEASE-PACKAGE"
          grep -v ' RELEASE-PACKAGE$' "$pkg/SHA256SUMS" > "$pkg/SHA256SUMS.new"
          mv "$pkg/SHA256SUMS.new" "$pkg/SHA256SUMS"
          echo "root=${RUNNER_TEMP//\\//}/pkg" >> "$GITHUB_OUTPUT"
          echo "binary=${pkg//\\//}/probation.exe" >> "$GITHUB_OUTPUT"
      # No OpenSSL, and no DLL of any kind that is not part of Windows or the C runtime, in what the binary imports.
      - name: The packaged exe imports only system libraries
        shell: powershell
        run: |
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\pkg\probation-*\probation.exe").FullName
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $deps = & $dumpbin /dependents $exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLower() }
          $deps
          $system = '^(kernel32|ntdll|advapi32|ws2_32|crypt32|user32|gdi32|bcrypt|ncrypt|secur32|userenv|ole32|oleaut32|shell32|shlwapi|setupapi|iphlpapi|mswsock|dbghelp|psapi|winmm|rpcrt4|sechost|combase|cfgmgr32|win32u|cryptbase|bcryptprimitives|ucrtbase|vcruntime140(_1)?|msvcp140|api-ms-win-[a-z0-9-]+)\.dll$'
          $bad = @($deps | Where-Object { $_ -notmatch $system -or $_ -match 'libcrypto|libssl' })
          if ($bad.Count -gt 0) { throw "the binary imports non-system libraries: $($bad -join ', ')" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-package-windows
          path: ${{ steps.pkg.outputs.root }}
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-binary-windows
          path: ${{ steps.pkg.outputs.binary }}
          retention-days: 1
          if-no-files-found: error

  # Compiles nothing and runs no command: it holds the OIDC and attestation permissions, so it has two `uses` steps and no `run`.
  attest-windows:
    needs: service-windows-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-binary-windows
          merge-multiple: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ci-binary-windows/probation.exe

  service-windows:
    needs: attest-windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-package-windows
          path: ${{ runner.temp }}/pkg
      - name: Record the OS
        shell: powershell
        run: |
          [Environment]::OSVersion | Format-List
          (Get-CimInstance Win32_OperatingSystem).Caption
          Get-Command sc.exe, icacls.exe | Format-Table Name, Version
      # The hosted runner's user is an administrator. The installed service is tested with nothing of the build on PATH: a DLL the
      # installer failed to put beside probation.exe is a failed start here, not a hidden success.
      - name: Native lifecycle from the package (Windows service as NT SERVICE\Probation, clean PATH)
        env:
          E2E_SERVICE_SCOPE: system
          E2E_SERVICE_DIRS: system
          NATIVE_TEST_SCRATCH: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          E2E_SERVICE_SIGNER_WORKFLOW: .github/workflows/native-service.yml
          E2E_SERVICE_SOURCE_DIGEST: ${{ github.sha }}
        run: |
          pkg=$(echo "$RUNNER_TEMP"/pkg/probation-*)
          node_dir=$(dirname "$(command -v node)")
          gh_dir=$(dirname "$(command -v gh)")
          PATH="$node_dir:$gh_dir:/c/Windows/System32:/c/Windows/System32/WindowsPowerShell/v1.0:/c/Windows" E2E_SERVICE_PACKAGE="$pkg" node tests/e2e/native/service-lifecycle-run.mjs

  tools:
    name: tools ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-26
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      AWS_LC_SYS_USE_SYSTEM: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.PIN_GO }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.PIN_DOTNET }}
      - uses: ruby/setup-ruby@341b6d4d1c7bdbe628940ab4e27cbdc9c97950cc # v1.340.0
        with:
          ruby-version: ${{ env.PIN_RUBY }}
          rubygems: ${{ env.PIN_RUBYGEMS }}
      - name: Provide OpenSSL's libcrypto for the OCSP code
        shell: bash
        run: node tests/e2e/native/openssl-setup.mjs apply
      # The runner image ships a newer SDK in the same dotnet root and the muxer picks the highest one (hosted run 45455094825: want 8.0.416, got
      # 11.0.100). A global.json above both the checkout and $RUNNER_TEMP (where the tests below make their directories) selects the pin.
      - name: Select the pinned .NET SDK
        shell: bash
        run: dotnet new globaljson --sdk-version "$PIN_DOTNET" --roll-forward disable --output "$(cd "$GITHUB_WORKSPACE/../.." && pwd)" --force
      - name: Verify the pinned tool versions
        shell: bash
        run: |
          [ "$(go env GOVERSION)" = "go$PIN_GO" ] || { echo "go: want $PIN_GO, got $(go env GOVERSION)"; exit 1; }
          [ "$(cargo --version | cut -d' ' -f2)" = "1.96.0" ] || { echo "cargo: want 1.96.0, got $(cargo --version)"; exit 1; }
          [ "$(dotnet --version)" = "$PIN_DOTNET" ] || { echo "dotnet: want $PIN_DOTNET, got $(dotnet --version)"; exit 1; }
          [ "$(ruby -e 'print RUBY_VERSION')" = "$PIN_RUBY" ] || { echo "ruby: want $PIN_RUBY"; exit 1; }
          [ "$(gem --version)" = "$PIN_RUBYGEMS" ] || { echo "rubygems: want $PIN_RUBYGEMS, got $(gem --version)"; exit 1; }
      # The tests skip loudly where their tool is absent; a skipped lane is a failed lane here.
      - name: Native Cargo, Go, NuGet and RubyGems clients against the firewall
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          cargo test --locked --test cargo_native --test go_native --test nuget_native --test rubygems_native -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/tools.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/tools.log"; then echo "a native lane did NOT run"; grep "SKIPPED" "$RUNNER_TEMP/tools.log"; exit 1; fi
          grep -c "^test .* ok$" "$RUNNER_TEMP/tools.log"
      # The credential-reads folder checks on the platforms rust.yml (ubuntu only) does not run: Windows (handle pinning, reparse points,
      # owner and DACL) and macOS (the descriptor code with the named body-file fallback and the rustix `Dir` sweep). It runs even when the
      # step above failed (`!cancelled()`), so one failed lane never hides this evidence; the job still fails with that step.
      - name: Windows and macOS credential-reads folder checks
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo "Linux runs these tests in rust.yml"
          else
            cargo test --locked --lib --test credential_temp -- credential_temp key_acl --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/credential-temp.log"
            if [ "$RUNNER_OS" = Windows ]; then
              n=$(awk '/^test credential_temp_windows_.* ok$/ {c++} END {print c+0}' "$RUNNER_TEMP/credential-temp.log")
              [ "$n" -ge 6 ] || { echo "want 6 Windows credential-reads tests to pass, got $n"; exit 1; }
            else
              n=$(awk '/^test credential_temp_.* ok$/ {c++} END {print c+0}' "$RUNNER_TEMP/credential-temp.log")
              [ "$n" -ge 16 ] || { echo "want 16 credential-reads tests to pass on $RUNNER_OS, got $n"; exit 1; }
            fi
          fi

  # Maven and Conan with the host's own pinned tools (the podman-image lane above is Linux only).
  tools-host:
    name: tools-host ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-26
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      AWS_LC_SYS_USE_SYSTEM: "0"
      PROBATION_NATIVE_HOST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.PIN_NODE }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.0"
      - name: Provide OpenSSL's libcrypto for the OCSP code
        run: node tests/e2e/native/openssl-setup.mjs apply
      # Maven 3.9.16 from the Apache archive, verified against the published SHA-512 (recorded here).
      - name: Install the pinned Maven
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check --strict -
          # relative paths: GNU tar reads `D:\a\...` (a drive letter) as host:path, and bsdtar has no --force-local
          (cd "$RUNNER_TEMP" && mkdir -p maven && tar xzf maven.tar.gz -C maven --strip-components=1)
          echo "$RUNNER_TEMP/maven/bin" >> "$GITHUB_PATH"
      # Conan and every dependency by exact version and sha256 (generated with `uv pip compile --universal --generate-hashes`).
      - name: Install the pinned Conan (hash-locked)
        run: python -m pip install --require-hashes -r tests/e2e/native/conan-requirements.txt
      - name: Verify the pinned tool versions
        run: |
          mvn --version | tee "$RUNNER_TEMP/mvn-version.txt"
          grep -q "Apache Maven 3.9.16" "$RUNNER_TEMP/mvn-version.txt"
          conan --version | grep -q "2.21.0"
      # Provisioning: the plugin the test's goals need is fetched once into a seed repository; the test itself never downloads.
      # Slice 27 (found by running this lane on a Linux host): Maven records the id of the repository an artifact came from, and the
      # test's mirror is named `probation`, so the seed is fetched through a mirror of that id (as tests/e2e/compose/clients/maven.Dockerfile
      # does); seeded through the default `central` id, the plugin was "unavailable in current build context" and the test failed
      # (maven_native runs only the dependency plugin, so the image's second plugin is not needed here).
      # Maven Central answered 429 to hosted runners (hosted run, tools/tools-host linux-x64): the seed is cached by plugin version, and a hit leaves nothing to fetch (the step still runs, offline-fast), a miss is
      # Round 4: repo.maven.apache.org still answered 429 on all 3 attempts; the seed is fetched from Google's Maven Central mirror instead.
      # fetched with three attempts (60 s, then 120 s apart). The cache saves only when the step succeeds.
      - name: Cache the seeded Maven plugin repository
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/seed-m2
          key: maven-seed-dependency-plugin-3.8.1-${{ runner.os }}
      - name: Seed the Maven plugin repository
        run: |
          mkdir -p "$RUNNER_TEMP/seed-m2" "$RUNNER_TEMP/seedproj"
          printf '%s\n' '<settings><mirrors><mirror><id>probation</id><mirrorOf>*</mirrorOf><url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>' > "$RUNNER_TEMP/seedproj/settings.xml"
          printf '<project><modelVersion>4.0.0</modelVersion><groupId>seed</groupId><artifactId>seed</artifactId><version>1</version><packaging>pom</packaging></project>' > "$RUNNER_TEMP/seedproj/pom.xml"
          seeded=no
          for attempt in 1 2 3; do
            if (cd "$RUNNER_TEMP/seedproj" && mvn -B -q -s settings.xml -Dmaven.repo.local="$RUNNER_TEMP/seed-m2" org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies); then seeded=yes; break; fi
            [ "$attempt" = 3 ] || { echo "seed attempt $attempt failed; retrying in $((attempt * 60)) s"; sleep $((attempt * 60)); }
          done
          [ "$seeded" = yes ] || { echo "the Maven plugin seed failed after 3 attempts"; false; }
      # The seed is compared with the committed manifest on a cache hit and on a miss alike (no `if`): a poisoned cache or a changed mirror fails here.
      - name: Verify the Maven plugin seed against its committed manifest
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then sum="sha256sum"; else sum="shasum -a 256"; fi
          # Git for Windows' sha256sum marks every line as binary-mode (`<hash> *<path>`, hosted run 46132783086); the manifest has two spaces.
          (cd "$RUNNER_TEMP/seed-m2" && find . \( -name '*.jar' -o -name '*.pom' \) | LC_ALL=C sort | xargs $sum | sed -E 's/^([0-9a-f]{64}) \*/\1  /') | diff - tests/e2e/compose/clients/maven-seed.sha256
      # tests/conan_native.rs runs its host scripts with `bash`; on a Windows runner that name finds System32's WSL launcher first (hosted run
      # 45455094825: "Windows Subsystem for Linux has no installed distributions"). Git's bash goes in front (GITHUB_PATH prepends).
      - name: Git's bash before the WSL launcher
        shell: bash
        run: '[ "$RUNNER_OS" != Windows ] || echo ''C:\Program Files\Git\bin'' >> "$GITHUB_PATH"'
      - name: Native Maven and Conan clients (host tools) against the firewall
        env:
          PROBATION_MAVEN_SEED: ${{ runner.temp }}/seed-m2
        run: |
          PROBATION_NATIVE_STRICT=1 cargo test --locked --test maven_native --test conan_native -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/tools-host.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/tools-host.log"; then echo "a native lane did NOT run"; exit 1; fi

  tools-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - name: Build the pinned Maven and Conan client images
        run: |
          podman build -f tests/e2e/compose/clients/maven.Dockerfile -t localhost/probation-e2e-client:maven3.9.16 tests/e2e/compose/clients
          podman build -f tests/e2e/compose/clients/conan.Dockerfile -t localhost/probation-e2e-client:conan2.21.0 tests/e2e/compose/clients
      # podman refuses a runroot over 50 characters; the default under the checkout's parent is longer than that on a hosted runner.
      - name: Native Maven, Conan and podman OCI clients against the firewall
        env:
          PROBATION_OCI_RUNROOT: ${{ runner.temp }}/oci
        run: |
          PROBATION_NATIVE_STRICT=1 cargo test --locked --test maven_native --test conan_native --test oci_native -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/tools-linux.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/tools-linux.log"; then echo "a native lane did NOT run"; grep "SKIPPED" "$RUNNER_TEMP/tools-linux.log"; exit 1; fi

  docker-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a hosted macOS
      # runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - name: Install and start the pinned Docker Engine
        run: tests/e2e/native/docker-engine.sh install
      - name: Docker Engine daemon pull against the OCI routes
        env:
          PROBATION_OCI_ENGINE: docker
        run: |
          cargo test --locked --test oci_native -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/docker-engine.log"
          grep -q "DOCKER ENGINE WITNESS: version $PIN_DOCKER_ENGINE" "$RUNNER_TEMP/docker-engine.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/docker-engine.log"; then echo "the Docker lane did NOT run"; exit 1; fi
