name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `probation-server`'s tests need Postgres; each makes its own database in it.
      - run: docker compose -f docker-compose.test.yml up -d --wait postgres
      - run: cargo test --workspace --locked

  # The static OpenSSL link of the release builds, compiled on every pull request (not only on a tag): a failing link must fail here.
  # macOS links Homebrew's libcrypto.a of the runner's own architecture (the Intel runner builds the x86_64 target); Windows MSVC links
  # vcpkg's x64-windows-static-md. The default `cargo build` of the `build` job above is unchanged: the feature is off.
  static-link:
    name: static-link ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      AWS_LC_SYS_USE_SYSTEM: "0"
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - run: rustup target add ${{ matrix.target }}
      - run: node tests/e2e/native/openssl-setup.mjs apply
        shell: bash
      - run: cargo build --locked --bin probation --target ${{ matrix.target }} --features static-openssl
      - name: The binary names no OpenSSL library (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L "target/${{ matrix.target }}/debug/probation" | tee otool.txt
          if grep -E "/opt/homebrew|/usr/local/(opt|Cellar)|libcrypto" otool.txt; then echo "libcrypto is linked dynamically"; exit 1; fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - run: rustup component add llvm-tools
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --summary-only --fail-under-lines 98

  # The real-client tests are `#[ignore]` because they spawn npm and pip. They pin
  # their clients (tests/e2e_npm.rs, tests/e2e_pip.rs, docs/operations.md §11); this
  # job installs exactly those pins so the matrix they claim is the one that ran.
  e2e:
    runs-on: ubuntu-latest
    env:
      PROBATION_E2E_CLIENTS: ${{ github.workspace }}/../e2e-clients
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: v24.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned clients
        run: |
          set -euo pipefail
          for v in 10.9.9 12.0.2; do
            npm install --prefix "$PROBATION_E2E_CLIENTS/npm-$v" "npm@$v"
          done
          for v in 25.0.1 26.2.1; do
            python3 -m pip install --target "$PROBATION_E2E_CLIENTS/pip-$v" "pip==$v"
          done
          # The pip tests build their fixture packages with `python -m build --no-isolation`.
          python3 -m pip install build==1.2.2 setuptools==78.1.1
          echo "PROBATION_E2E_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - run: cargo test --locked --test e2e_npm --test e2e_pip -- --ignored
