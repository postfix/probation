name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Every job that compiles runs dependency build scripts and proc-macros, so none of
# them gets a write token. Only `release`, which compiles nothing, may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `probation-server`'s tests need Postgres; each makes its own database in it.
      - run: docker compose -f docker-compose.test.yml up -d --wait postgres
      - run: cargo test --workspace --locked
      # Slice 27: the nine transports' hot paths in a release build; a missed bound (docs/operations.md, "Rated load per transport")
      # fails the gate. The cross-plan acceptance walk (tests/cross_plan_acceptance.rs) is part of the test run above.
      - run: cargo bench --locked --bench transport_hot_paths -- --assert

  # The release e2e gate (D6): the release suite on the stack of the exact images,
  # offline against the fakes. It includes E2E-signup-to-install and M-propagation
  # (C82): a new organisation signs up and installs with npm through a managed firewall
  # in under 10 minutes, and changes reach two firewalls within one sync interval.
  # Nothing is published unless this passes. The images it tested are what `images`
  # publishes; they build here without the Actions cache, so nothing a branch wrote into
  # the cache reaches a published image.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # E2E-010 builds the previous release from its tag.
          fetch-depth: 0
      - run: npm ci --prefix tests/e2e --no-audit --no-fund
      - run: npx --prefix tests/e2e playwright install --with-deps chromium
      - run: node tests/e2e/harness/run.mjs --suite release
      - shell: bash # -eo pipefail: a failed docker save must fail the step
        run: docker save localhost/probation:e2e localhost/probation-server:e2e | gzip > images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-release
          path: target/e2e/out
          if-no-files-found: ignore

  # Native npm/Python publishing acceptance on Linux, macOS and Windows with the pinned
  # clients (publishing-proxy Slice 5). Nothing is released unless every OS passes.
  native:
    needs: test
    # The called workflow reads this run's artifacts (the real-server handshake).
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-clients.yml

  # Row 25: the machine-wide native service lifecycle on Linux, macOS and Windows, the native package tools on all three, and the
  # pinned Docker Engine daemon pull. Nothing is released unless every one of them passes (a skipped lane fails it).
  native-service:
    needs: test
    # The macOS and Windows lanes attest the CI package they install (the installer verifies that attestation in full), so the caller must
    # grant what those jobs ask for: a called workflow cannot hold more than its caller gives it.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/native-service.yml

  codeql:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: github/codeql-action/init@b31ef66637df4fc5b5e4a89d0cc94f8eeb46a04d # v3.39.0
        with:
          languages: rust
      - run: cargo build --locked
      - uses: github/codeql-action/analyze@b31ef66637df4fc5b5e4a89d0cc94f8eeb46a04d # v3.39.0

  # `build` waits for native-service (and for build-windows, so the release job sees every artifact): release, publish and images
  # need build, so none of them runs unless the native service lifecycle lane passed.
  build:
    needs: [codeql, native-service, build-windows]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            features: "--features static-openssl"
          # An Intel runner: Homebrew's libcrypto.a is of the runner's own architecture, so the x86_64 binary links an x86_64 archive.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            features: "--features static-openssl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - run: rustup target add ${{ matrix.target }}
      # src/managed/enterprise_certificate.rs links OpenSSL's libcrypto by name: macOS needs Homebrew's openssl@3 on the linker path
      # (Linux has the system library), and aws-lc-sys must build its bundled source, as native-clients.yml does.
      - run: node tests/e2e/native/openssl-setup.mjs apply
      - run: cargo build --release --locked --bin probation --target ${{ matrix.target }} ${{ matrix.features }}
        env:
          AWS_LC_SYS_USE_SYSTEM: "0"
      # The package is the binary, the service installer and the files it installs from: a downloaded release installs as a
      # service with ./install-service.sh install (docs/operations.md, "Native service").
      - name: Package
        # The tag name reaches the shell through the environment, never by interpolation into the script (a tag name is attacker-chosen text).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir=$(VERSION="$REF_NAME" scripts/package-release.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/probation" .)
          pkg=$(basename "$dir")
          tar czf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probation-${{ matrix.target }}
          path: |
            probation-*.tar.gz
            probation-*.tar.gz.sha256

  # Windows: a zip with probation.exe, the OpenSSL DLL it loads, the service installer (install-service.ps1) and the files it
  # installs from. Built after the same gate as the other targets.
  build-windows:
    needs: [codeql, native-service]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      # OPENSSL_STATIC=1: vcpkg's x64-windows-static-md libcrypto is linked into probation.exe; no OpenSSL DLL is shipped or needed.
      - name: Provide a static OpenSSL libcrypto for the OCSP code
        shell: bash
        env:
          OPENSSL_STATIC: "1"
        run: node tests/e2e/native/openssl-setup.mjs apply
      - run: cargo build --release --locked --bin probation --target x86_64-pc-windows-msvc --features static-openssl
        env:
          AWS_LC_SYS_USE_SYSTEM: "0"
      - name: Package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          dir=$(VERSION="$REF_NAME" scripts/package-release.sh x86_64-pc-windows-msvc target/x86_64-pc-windows-msvc/release/probation.exe .)
          pkg=$(basename "$dir")
          7z a "$pkg.zip" "$pkg"
          sha256sum "$pkg.zip" > "$pkg.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probation-x86_64-pc-windows-msvc
          path: |
            probation-*.zip
            probation-*.zip.sha256

  release:
    needs: [build, e2e, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: probation-*
          merge-multiple: true
      # Keyless cosign signature of every binary (the Sigstore bundle is the signature, the certificate and the transparency-log proof).
      # install-service.sh verifies it when cosign is installed: save probation-<version>-<target>.sigstore.json beside the binary as
      # probation.sigstore.json, or pass --cosign-bundle (docs/operations.md).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the binaries
        run: |
          mkdir sign
          for archive in probation-*.tar.gz; do
            name="${archive%.tar.gz}"
            tar xzf "$archive" -C sign
            cosign sign-blob --yes --bundle "$name.sigstore.json" "sign/$name/probation"
          done
          for archive in probation-*.zip; do
            name="${archive%.zip}"
            unzip -q "$archive" -d sign
            cosign sign-blob --yes --bundle "$name.sigstore.json" "sign/$name/probation.exe"
          done
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes probation-*.tar.gz probation-*.tar.gz.sha256 probation-*.zip probation-*.zip.sha256 probation-*.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}

  # Provenance for what was released: GitHub's build-provenance attestation for the binaries and archives, stored with the
  # repository next to the same-origin .sha256 files. install-service.sh and .ps1 check it with `gh attestation verify` when gh is
  # installed (docs/operations.md).
  attest:
    needs: [e2e, native, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: probation-*
          merge-multiple: true
      - name: Unpack the binaries to attest
        run: |
          mkdir attest
          for archive in probation-*.tar.gz; do tar xzf "$archive" -C attest; done
          for archive in probation-*.zip; do unzip -q "$archive" -d attest; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            probation-*.tar.gz
            probation-*.zip
            attest/*/probation
            attest/*/probation.exe

  # The release is created as a DRAFT and published only after its attestations exist: there is no window in which an unattested
  # asset is downloadable as a release.
  publish-release:
    needs: [attest, e2e, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [release, e2e, native]
    runs-on: ubuntu-latest
    # Give this environment required reviewers in the repository settings, so a
    # pushed tag alone cannot publish to crates.io.
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # An explicit install: the first `cargo` or `rustup` call would otherwise auto-install rust-toolchain.toml's toolchain, which left a
      # hosted macOS runner without cargo (run 45840170035: "'cargo' is not installed for the toolchain '1.96.0-aarch64-apple-darwin'").
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          cargo --version
      # The verification build runs every dependency's build script; it runs here,
      # before the registry token is in the environment. `probation` depends on
      # `probation-policy` at the same version (C117): `--workspace` packages both,
      # verifying `probation` against the locally packaged `probation-policy`, and
      # publishes `probation-policy` first, waiting for it to reach the index. If that
      # wait times out after `probation-policy` is uploaded, finish with
      # `cargo publish -p probation` rather than re-running `--workspace`.
      # `probation-server` is `publish = false` (C117): `publish --workspace` skips it,
      # and `package` would otherwise still package and verify it.
      - run: cargo package --workspace --exclude probation-server --locked
      - run: cargo publish --workspace --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # D7: both images, exactly as the e2e gate tested them, to the GitHub Container
  # Registry, tagged with the version and the commit. Compiles nothing, so it may write.
  images:
    needs: [release, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images
      - name: Push
        run: |
          set -euo pipefail
          gunzip -c images.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          for image in probation probation-server; do
            for tag in "$version" "$GITHUB_SHA"; do
              docker tag "localhost/$image:e2e" "ghcr.io/postfix/$image:$tag"
              docker push "ghcr.io/postfix/$image:$tag"
            done
          done
        env:
          GH_TOKEN: ${{ github.token }}
